<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS AdBlock Detection (Using JavaScript File)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #adblock-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #fff3cd;
      color: #856404;
      border-bottom: 2px solid #ffeeba;
      padding: 16px;
      z-index: 9999;
      text-align: center;
      font-size: 16px;
    }

    .content {
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div id="adblock-message">
    🚫 We noticed you're using a DNS-level ad blocker (like AdGuard DNS).<br>
    Please disable it for the best experience on our site. 🙏
  </div>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>This is a sample page. If you're using DNS-level ad blocking, a message will appear.</p>
  </div>

  <script>
    function detectDNSAdBlocker(callback) {
      const xhr = new XMLHttpRequest();
      // Try to load a known JavaScript resource from an ad network
      xhr.open("GET", "https://securepubads.g.doubleclick.net/tag/js/gpt.js", true);

      xhr.onload = () => {
        if (xhr.status === 200) {
          callback(false); // If it loads successfully, no DNS blocking
        }
      };

      xhr.onerror = () => {
        callback(true); // If it fails to load, DNS blocking is likely
      };

      xhr.send();
    }

    function showAdBlockMessage() {
      const msg = document.getElementById("adblock-message");
      msg.style.display = "block";
    }

    // Run the detection when the page loads
    window.addEventListener("load", () => {
      setTimeout(() => {
        detectDNSAdBlocker((isBlocked) => {
          if (isBlocked) {
            showAdBlockMessage();
          }
        });
      }, 300); // Delay added to ensure the page has fully loaded

      // Recheck after a longer delay to handle DNS changes dynamically
      setTimeout(() => {
        detectDNSAdBlocker((isBlocked) => {
          if (isBlocked) {
            showAdBlockMessage();
          }
        });
      }, 5000); // Recheck after 5 seconds to ensure DNS changes are reflected
    });
  </script>

</body>
</html>
