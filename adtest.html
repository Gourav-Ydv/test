<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS AdBlock Detection (Fixed)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #adblock-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #fff3cd;
      color: #856404;
      border-bottom: 2px solid #ffeeba;
      padding: 16px;
      z-index: 9999;
      text-align: center;
      font-size: 16px;
    }

    .content {
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div id="adblock-message">
    🚫 We noticed you're using a DNS-level ad blocker (like AdGuard DNS).<br>
    Please disable it for the best experience on our site. 🙏
  </div>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>This is a sample page. If you're using DNS-level ad blocking, a message will appear.</p>
  </div>

  <script>
    function detectDNSAdBlocker(callback) {
      const bait = new Image();
      // Force cache busting by appending a unique timestamp
      bait.src = "https://tpc.googlesyndication.com/simgad/7067107348729833176?t=" + Date.now();

      // Image load event: if successful, the ad is not blocked
      bait.onload = () => {
        callback(false);  // DNS blocking is not active
      };

      // Image error event: if it fails, assume DNS-level blocking
      bait.onerror = () => {
        callback(true);  // DNS blocking is active
      };
    }

    function showAdBlockMessage() {
      const msg = document.getElementById("adblock-message");
      msg.style.display = "block";
    }

    // Run the initial detection when the page loads
    window.addEventListener("load", () => {
      setTimeout(() => {
        detectDNSAdBlocker((isBlocked) => {
          if (isBlocked) {
            showAdBlockMessage();
          }
        });
      }, 300); // Delay added to ensure the page has fully loaded

      // Recheck after a short delay to handle DNS changes dynamically
      setTimeout(() => {
        detectDNSAdBlocker((isBlocked) => {
          if (isBlocked) {
            showAdBlockMessage();
          }
        });
      }, 2000); // Recheck after 2 seconds
    });
  </script>

</body>
</html>
