<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS AdBlock Detection (Fixed)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #adblock-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #fff3cd;
      color: #856404;
      border-bottom: 2px solid #ffeeba;
      padding: 16px;
      z-index: 9999;
      text-align: center;
      font-size: 16px;
    }

    .content {
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div id="adblock-message">
    🚫 We noticed you're using a DNS-level ad blocker (like AdGuard DNS).<br>
    Please disable it for the best experience on our site. 🙏
  </div>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>This is a sample page. If you're using DNS-level ad blocking, a message will appear.</p>
  </div>

  <script>
   function detectDNSAdBlocker(callback) {
  const bait = new Image();
  bait.src = "https://pagead2.googlesyndication.com/pagead/imgad?id=CICAgKDz8J2cHhABEAEYCLge6CBk5CSN&t=" + Math.random();
  bait.onload = () => callback(false); // Not blocked
  bait.onerror = () => callback(true); // Blocked
}


    function showAdBlockMessage() {
      const msg = document.getElementById("adblock-message");
      msg.style.display = "block";
    }

    detectDNSAdBlocker((isBlocked) => {
      if (isBlocked) {
        showAdBlockMessage();
      }
    });
  </script>

</body>
</html>
