<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS AdBlock Detection (Fixed)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #adblock-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #fff3cd;
      color: #856404;
      border-bottom: 2px solid #ffeeba;
      padding: 16px;
      z-index: 9999;
      text-align: center;
      font-size: 16px;
    }

    .content {
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div id="adblock-message">
    🚫 We noticed you're using a DNS-level ad blocker (like AdGuard DNS).<br>
    Please disable it for the best experience on our site. 🙏
  </div>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>This is a sample page. If you're using DNS-level ad blocking, a message will appear.</p>
  </div>
  <script>
  function detectDNSAdBlocker(callback) {
    const bait = new Image();
    bait.src = "https://tpc.googlesyndication.com/simgad/7067107348729833176?t=" + Date.now();

    // Check if image was successfully loaded
    bait.onload = () => {
      // If the image is loaded, we know it's not being blocked
      callback(false);
    };

    // If there's an error (like DNS blocking), we assume it's blocked
    bait.onerror = () => {
      callback(true);
    };
  }

  function showAdBlockMessage() {
    const msg = document.getElementById("adblock-message");
    msg.style.display = "block";
  }

  window.addEventListener("load", () => {
    setTimeout(() => {
      detectDNSAdBlocker((isBlocked) => {
        if (isBlocked) {
          showAdBlockMessage();
        }
      });
    }, 200); // Delay to make sure page is fully loaded
  });
</script>




</body>
</html>
