<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS AdBlock Detection (Advanced)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #adblock-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #fff3cd;
      color: #856404;
      border-bottom: 2px solid #ffeeba;
      padding: 16px;
      z-index: 9999;
      text-align: center;
      font-size: 16px;
    }

    .content {
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div id="adblock-message">
    🚫 We noticed you're using a DNS-level ad blocker (like AdGuard DNS).<br>
    Please disable it for the best experience on our site. 🙏
  </div>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>This is a sample page. If you're using DNS-level ad blocking, a message will appear.</p>
  </div>

  <script>
    // Function to detect DNS ad blocker by checking a known ad script
    function detectDNSAdBlocker(callback) {
      const xhr = new XMLHttpRequest();
      
      // Synchronously attempt to load a known Google ad script (gpt.js)
      xhr.open("GET", "https://securepubads.g.doubleclick.net/tag/js/gpt.js", false); // Synchronous request
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          // If the request succeeds, no blocking
          if (xhr.status === 200) {
            callback(false);
          } else {
            // If the status is not 200, consider it blocked
            callback(true);
          }
        }
      };
      xhr.send();
    }

    // Function to show the adblock warning message
    function showAdBlockMessage() {
      const msg = document.getElementById("adblock-message");
      msg.style.display = "block";
    }

    // Run detection before page loads completely
    window.addEventListener("load", () => {
      // Perform the detection immediately when the page is ready
      detectDNSAdBlocker((isBlocked) => {
        if (isBlocked) {
          showAdBlockMessage();
        }
      });

      // Recheck after 3 seconds to handle DNS toggle during the page load
      setTimeout(() => {
        detectDNSAdBlocker((isBlocked) => {
          if (isBlocked) {
            showAdBlockMessage();
          }
        });
      }, 3000); // Recheck DNS status after 3 seconds
    });

    // Repeated check at intervals to detect DNS changes dynamically
    setInterval(() => {
      detectDNSAdBlocker((isBlocked) => {
        if (isBlocked) {
          showAdBlockMessage();
        }
      });
    }, 10000); // Recheck every 10 seconds to detect DNS changes
  </script>

</body>
</html>
